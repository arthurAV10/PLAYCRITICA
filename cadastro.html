<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYCRITICA - CADASTRO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="topo">
            <h1>PLAYCRITICA</h1>
            <a href="login.html" class="entrar">LOGIN</a>
        </div>  
        <nav>
            <ul>
                <li><a href="#" id="btn-inicio">Início</a></li>
                <li><a href="#" id="btn-sobre">Sobre</a></li>
                <li><a href="#" id="btn-contato">Contato</a></li>
            </ul>
        </nav>
    </header>
    <aside id="sidebar" class="sidebar">
        <button id="btn-fechar" class="btn-fechar">&times;</button>
        <div id="conteudo-sidebar" class="conteudo-sidebar"></div>
    </aside>

    <main id="cadastro-main">
        <div class="cadastro">
            <h2>CRIAR CONTA</h2>
            <p>Cadastre-se para entrar no PLAYCRITICA</p>
        </div>
        <form id="formcadastro">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>
            <br>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>
            <br>
            <label for="endereço">Endereço</label>
            <input type="text" id="endereço" placeholder="Digite seu endereço" required>
            <br>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
            <br>
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
            <br>
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" required>
            <br>
<button type="submit" id="botao2">CADASTRAR</button>
        </form>
        <footer>@todos direitos reservados a Arthur e Elisa 06/10/2026</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
